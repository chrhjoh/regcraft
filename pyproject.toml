[project]
name = "regkit"
version = "0.1.0"
description = "Swiss-army knife for danish registries"
readme = "README.md"
authors = [
{name = "BrunakLab"}
]
    
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
regkit = "regkit.cli:cli"


[tool.pyrefly]
site-package-path = ["/opt/editor-env/lib/python3.13/site-packages"]

