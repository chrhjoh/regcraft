name: Release on PyPi and github

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA (defaults to latest commit on main)
        type: string
        required: false
      dry-run:
        description: Build and test without publishing
        type: boolean
        default: false

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      sha: ${{ inputs.sha || github.sha }}

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false

      - name: Get version
        id: version
        run: |
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs:
      - test
      - build

    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/${{ github.event.repository.name }}/

    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist/

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a

      - name: Publish to PyPI
        if: ${{ !inputs.dry-run }}
        run: uv publish

      - name: Create GitHub release
        if: ${{ !inputs.dry-run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT_SHA: ${{ inputs.sha || github.sha }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --title "${GITHUB_REPOSITORY#*/} ${VERSION}" \
            --generate-notes \
            --target "${COMMIT_SHA}"
